<!DOCTYPE html>
<html>
<head>
    <title>GraphQL Test</title>
</head>
<body>
    <h1>GraphQL Test</h1>
    <button onclick="testCommentQuery()">Test Comment Query</button>
    <div id="result"></div>

    <script>
        async function testCommentQuery() {
            const query = `
                query Comment($id: Long!) {
                    comment(id: $id) {
                        id
                        status
                        draft {
                            created
                            updated
                            text {
                                lang
                                text
                            }
                        }
                        text {
                            created
                            updated
                            text {
                                lang
                                text
                            }
                        }
                    }
                }
            `;

            try {
                const response = await fetch('http://0.0.0.0:8080/graphql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: { id: 1 }
                    })
                });

                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
