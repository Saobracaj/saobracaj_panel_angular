<div class="page-container">
  <mat-toolbar color="primary" class="toolbar-container">
    <span>Список комментариев</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="logout()" matTooltip="Выйти">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <div class="content-container">
    <mat-card class="comments-card">
      <mat-card-header>
        <mat-card-title>Комментарии</mat-card-title>
        <mat-card-subtitle>Всего комментариев: {{comments.length}}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div *ngIf="isLoading" class="loading-container">
          <mat-spinner diameter="40"></mat-spinner>
          <p>Загрузка комментариев...</p>
        </div>

        <div *ngIf="error && !isLoading" class="error-container">
          <mat-icon color="warn">error</mat-icon>
          <p>{{error}}</p>
          <button mat-raised-button color="primary" (click)="loadComments()">
            Попробовать снова
          </button>
        </div>

        <div *ngIf="!isLoading && !error">
          <div *ngIf="comments.length === 0" class="empty-state">
            <mat-icon>comment</mat-icon>
            <p>Комментарии не найдены</p>
          </div>

          <mat-list *ngIf="comments.length > 0">
            <mat-list-item *ngFor="let comment of comments; trackBy: trackByCommentId" class="comment-item">
              <mat-icon matListItemIcon>comment</mat-icon>
              <div matListItemTitle>Комментарий #{{comment.id}}</div>
              <div matListItemLine>ID: {{comment.id}}</div>
            </mat-list-item>
          </mat-list>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
