<div class="question-preview-overlay">
  <mat-card class="preview-card">
    <mat-card-header>
      <mat-card-title class="question-number">
        Вопрос #{{question.qId}}
      </mat-card-title>
      <mat-card-subtitle class="question-info">
        {{question.ChoicesReq}} ответ(ов) | {{question.Points}} балл(ов)
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <!-- Текст вопроса -->
      <div class="question-text">
        <h4>Вопрос:</h4>
        <p>{{question.Text}}</p>
        
        <!-- Русский перевод вопроса -->
        <div *ngIf="russianTranslation && russianTranslation.Text" class="russian-translation">
          <h5>Вопрос (рус.):</h5>
          <p>{{russianTranslation.Text}}</p>
        </div>
      </div>

      <!-- Изображение вопроса -->
      <div *ngIf="question.HasImage" class="question-image">
        <img [src]="'https://saobracaj.gleb.at/img/' + question.qId + '.jpeg'" 
             [alt]="'Изображение для вопроса ' + question.qId"
             class="preview-img"
             (error)="onImageError($event)"
             (load)="onImageLoad($event)">
      </div>

      <!-- Варианты ответов -->
      <div class="question-choices">
        <h4>Варианты ответов:</h4>
        <div class="choices-list">
          <div *ngFor="let choice of question.Choices; let i = index" 
               class="choice-item"
               [class.correct]="choice.isCorrect">
            <div class="choice-header">
              <span class="choice-number">{{i + 1}}.</span>
              <span *ngIf="choice.isCorrect" class="correct-indicator">
                <mat-icon>check_circle</mat-icon>
              </span>
            </div>
            <div class="choice-content">
              <span class="choice-text">{{choice.Text}}</span>
              <!-- Русский перевод ответа -->
              <div *ngIf="getRussianChoiceTranslation(i)" class="russian-translation-choice">
                {{getRussianChoiceTranslation(i)}}
              </div>
            </div>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
