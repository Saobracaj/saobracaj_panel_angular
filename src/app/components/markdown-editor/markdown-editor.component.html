<mat-card class="markdown-editor-card">
  <mat-card-header>
    <mat-card-title>Редактор комментария</mat-card-title>
    <mat-card-subtitle>
      Статус: {{getStatusText()}}
      <span *ngIf="isSaving" class="saving-indicator">
        <mat-spinner diameter="16"></mat-spinner>
        Сохранение...
      </span>
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="isLoading" class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Загрузка комментария...</p>
    </div>

    <div *ngIf="!isLoading" class="editor-container">
      <div class="editor-header">
        <div class="editor-actions">
          <button 
            mat-raised-button 
            color="primary" 
            (click)="applyDraft()"
            [disabled]="isApplying || !editorContent.trim()">
            <mat-icon *ngIf="!isApplying">check</mat-icon>
            <mat-spinner *ngIf="isApplying" diameter="16"></mat-spinner>
            Применить
          </button>
        </div>
      </div>

      <div class="editor-content">
        <textarea
          appSimpleMDE
          [(value)]="editorContent"
          (change)="onContentChange($event)"
          [options]="{
            placeholder: 'Введите Markdown текст здесь...',
            spellChecker: false,
            autosave: { enabled: false },
            toolbar: [
              'bold', 'italic', 'strikethrough', '|',
              'heading', 'code', 'quote', '|',
              'unordered-list', 'ordered-list', '|',
              'link', 'image', 'table', '|',
              'preview', 'side-by-side', 'fullscreen'
            ],
            status: ['lines', 'words'],
            minHeight: '400px'
          }">
        </textarea>
      </div>

      <div class="editor-info">
        <p class="info-text">
          <mat-icon>info</mat-icon>
          Текст автоматически сохраняется как черновик при редактировании.
          Нажмите "Применить" чтобы сохранить как основной текст.
        </p>
      </div>
    </div>
  </mat-card-content>
</mat-card>
