<!-- Angular Material Components Demo -->
<mat-toolbar color="primary">
  <mat-icon>traffic</mat-icon>
  <span>{{ title }}</span>
  <span class="spacer"></span>
  <button mat-icon-button>
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>

<div class="container">
  <mat-card class="demo-card">
    <mat-card-header>
      <mat-card-title>Angular Material Components</mat-card-title>
      <mat-card-subtitle>Demonstration of various Material components</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <p>This is a demonstration of Angular Material components that have been successfully added to your project.</p>
      
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Enter some text</mat-label>
        <input matInput [(ngModel)]="inputValue" placeholder="Type something here...">
        <mat-icon matSuffix>edit</mat-icon>
      </mat-form-field>
      
      <p *ngIf="inputValue">You typed: <strong>{{ inputValue }}</strong></p>
    </mat-card-content>
    
    <mat-card-actions align="end">
      <button mat-button color="warn">
        <mat-icon>delete</mat-icon>
        Clear
      </button>
      <button mat-raised-button color="primary">
        <mat-icon>save</mat-icon>
        Save
      </button>
    </mat-card-actions>
  </mat-card>

  <div class="button-demo">
    <h3>Button Variants</h3>
    <div class="button-row">
      <button mat-button>Basic Button</button>
      <button mat-raised-button color="primary">Raised Primary</button>
      <button mat-stroked-button color="accent">Stroked Accent</button>
      <button mat-flat-button color="warn">Flat Warn</button>
    </div>
    
    <div class="button-row">
      <button mat-icon-button color="primary">
        <mat-icon>favorite</mat-icon>
      </button>
      <button mat-fab color="accent">
        <mat-icon>add</mat-icon>
      </button>
      <button mat-mini-fab color="warn">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</div>

<router-outlet />
